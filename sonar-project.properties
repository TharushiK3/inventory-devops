# Project identity
sonar.projectKey=inventory-devops
sonar.projectName=Inventory DevOps
sonar.projectVersion=1.0

# Application and test folders
sonar.sources=app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13

# Import the coverage generated by pytest
sonar.python.coverage.reportPaths=coverage.xml

# Exclude generated Python caches
sonar.exclusions=**/__pycache__/**

# Wait for the server's quality-gate result.
# Fail the scanner if the gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300