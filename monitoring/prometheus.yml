global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: inventory-health
    metrics_path: /probe
    params:
      module: [inventory_health]

    static_configs:
      - targets:
          - http://inventory-staging:5000/health
        labels:
          environment: staging

      - targets:
          - http://inventory-production:5000/health
        labels:
          environment: production

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox:9115